<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Sun Son Solar - Register</title>
 
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
 
        body {
            min-height: 100vh;
            background: #eef7ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
 
        .register-box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }
 
        .logo {
            text-align: center;
            margin-bottom: 25px;
        }
 
        .logo .sun {
            font-size: 50px;
        }
 
        .logo h1 {
            color: #0750a4;
            font-size: 25px;
            margin-top: 8px;
        }
 
        .logo h1 span {
            color: #ffb400;
        }
 
        .logo p {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }
 
        h2 {
            color: #163b65;
            margin-bottom: 6px;
        }
 
        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }
 
        .form-group {
            margin-bottom: 15px;
        }
 
        label {
            display: block;
            color: #333;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }
 
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5df;
            border-radius: 6px;
            outline: none;
        }
 
        input:focus {
            border-color: #0961c9;
        }
 
        .terms {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            margin: 15px 0;
            color: #555;
        }
 
        .terms input {
            width: auto;
        }
 
        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #0961c9;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
 
        .register-btn:hover {
            background: #064b9d;
        }
 
        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
 
        .login a {
            color: #0961c9;
            font-weight: bold;
            text-decoration: none;
        }
 
        @media (max-width: 500px) {
            .register-box {
                width: 90%;
                padding: 25px;
            }
        }
</style>
</head>
 
<body>
 
    <div class="register-box">
 
        <!-- LOGO -->
 
        <div class="logo">
 
            <div class="sun"></div>
 
            <h1>
                SUN SON <span>SOLAR</span>
</h1>
 
            <p>
                Powering a Brighter Future
</p>
 
        </div>
 
 
        <!-- REGISTRATION -->
 
        <h2>Create an Account</h2>
 
        <p class="subtitle">
            Please fill in your information below.
</p>
 
 
        <form onsubmit="register(event)">
 
            <div class="form-group">
 
                <label>Full Name</label>
 
                <input
                    id="name"
                    type="text"
                    placeholder="Enter your full name"
                    required
>
 
            </div>
 
 
            <div class="form-group">
 
                <label>Email</label>
 
                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required
>
 
            </div>
 
 
            <div class="form-group">
 
                <label>Username</label>
 
                <input
                    id="username"
                    type="text"
                    placeholder="Choose a username"
                    required
>
 
            </div>
 
 
            <div class="form-group">
 
                <label>Password</label>
 
                <input
                    id="password"
                    type="password"
                    placeholder="Create a password"
                    required
>
 
            </div>
 
 
            <div class="form-group">
 
                <label>Confirm Password</label>
 
                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm your password"
                    required
>
 
            </div>
 
 
            <label class="terms">
 
                <input
                    id="terms"
                    type="checkbox"
                    required
>
 
                I agree to the Terms and Conditions.
 
            </label>
 
 
            <button
                class="register-btn"
                type="submit"
>
                Create Account
</button>
 
        </form>
 
 
        <!-- LOGIN LINK -->
 
        <div class="login">
 
            Already have an account?
 
            <a href="login.html">
                Login
</a>
 
        </div>
 
    </div>
 
 
    <script>
 
        function register(event) {
 
            event.preventDefault();
 
 
            let name =
                document.getElementById("name").value;
 
            let email =
                document.getElementById("email").value;
 
            let username =
                document.getElementById("username").value;
 
            let password =
                document.getElementById("password").value;
 
            let confirmPassword =
                document.getElementById("confirmPassword").value;
 
 
            /* Check passwords */
 
            if (password !== confirmPassword) {
 
                alert("Passwords do not match.");
 
                return;
 
            }
 
 
            /* Save account */
 
            let user = {
 
                name: name,
 
                email: email,
 
                username: username,
 
                password: password
 
            };
 
 
            localStorage.setItem(
                "sunsonUser",
                JSON.stringify(user)
            );
 
 
            alert(
                "Registration successful!"
            );
 
 
            /* Go to login */
 
            window.location.href = "login.html";
 
        }
 
    </script>
 
</body>
</html>
